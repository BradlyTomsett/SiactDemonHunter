<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>方块围城</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;text-shadow:1px 2px #000;font-weight:bold;pointer-events:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;text-shadow:0 0 4px black;pointer-events:none}button{border:2px solid #ffffff80;color:white;background:#172426b8;border-radius:16px;font-weight:bold;font-size:18px;touch-action:none}#controls{display:none}#stick{position:absolute;left:5%;bottom:8%;width:120px;height:120px;border:2px solid #ffffff77;border-radius:50%;background:#0004}#knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#fffc}#fire,#reload{position:absolute;right:5%;bottom:9%;width:86px;height:86px;border-radius:50%;background:#b94b37bb}#reload{right:19%;bottom:7%;width:65px;height:65px;background:#334b50cc;font-size:15px}#screen{position:absolute;inset:0;display:grid;place-items:center;background:#0d191bd9;text-align:center;padding:20px}#screen h1{font-size:clamp(32px,7vw,64px);margin:0;color:#e8c675}#screen p{line-height:1.7;color:#d4dfd5}#start{padding:14px 38px;background:#cf6542}#rotate{display:none}@media (orientation:portrait){#rotate{display:block;position:absolute;inset:0;background:#132322;z-index:9;text-align:center;padding-top:35vh;font-size:24px}}@media(pointer:fine){#rotate{display:none}}
</style><canvas id="view" width="480" height="270"></canvas><div id="hud"><span id="health"></span><span id="score"></span><span id="ammo"></span></div><div id="cross">+</div><div id="controls"><div id="stick"><div id="knob"></div></div><button id="reload">换弹</button><button id="fire">开火</button></div><div id="screen"><div><h1 id="title">方块围城</h1><p id="desc">守住废弃营地，消灭 10 个感染者。<br>左侧摇杆移动 · 右侧滑动瞄准 · 开火 / 换弹<br>电脑：WASD 移动，鼠标瞄准，点击射击，R 换弹</p><button id="start">开始行动</button></div></div><div id="rotate">请将手机横屏游玩 ↻</div><script src="game.js"></script></html>
