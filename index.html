<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="theme-color" content="#eef9f5">
  <title>公司打狗</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./style.css">
  <script>if (window.innerHeight > window.innerWidth) document.documentElement.dataset.rotated = "1";</script>
</head>
<body>
  <main class="game" aria-label="公司打狗">
    <canvas id="world" width="1920" height="1080" aria-label="办公室桌面关卡"></canvas>

    <header class="hud" id="hud" hidden>
      <div class="hud-left">
        <span class="level-name" id="level-name"></span>
        <span class="score" id="score-display" aria-label="积分 0"><span aria-hidden="true">🏆</span> <span id="score">0</span></span>
        <span class="health" id="health" aria-label="生命"></span>
        <span id="equipment"></span>
        <span class="lives" id="lives" aria-label="剩余命数"></span>
      </div>
      <button class="pause" id="pause" type="button">暂停</button>
    </header>
    <p id="hint" class="hint" hidden></p>
    <p id="notice" class="notice" role="status" hidden></p>

    <div class="controls" id="controls" hidden>
      <div class="stick-zone" id="stick-zone" aria-label="左侧触摸移动与瞄准">
        <div class="joystick" id="joystick" hidden><span class="stick-knob" aria-hidden="true"></span></div>
      </div>
      <div class="control-group attacks" data-controls>
        <button class="pad" type="button" data-action="jump"><span>↑</span>跳跃</button>
        <button class="pad" type="button" data-action="grenade"><span>●</span>炸弹</button>
        <button class="pad fire" type="button" data-action="fire"><span>✦</span>射击</button>
      </div>
    </div>

    <section id="overlay" class="overlay" aria-labelledby="menu-title">
      <div class="panel">
        <span class="chapter" id="menu-chapter">第一关 · 桌面醒来</span>
        <h1 id="menu-title">公司打狗</h1>
        <p id="menu-message">你在键盘旁醒来，身体只剩回形针那么高。穿过桌面，找到出口。</p>
        <section id="stage-summary" class="stage-summary" aria-label="本段统计" hidden>
          <ul id="summary-list" class="summary-list" role="list"></ul>
          <p id="reward-prompt" class="reward-prompt">选择一项奖励，进入下一段</p>
        </section>
        <div id="character-select" class="character-select" role="group" aria-label="选择角色">
          <p class="character-prompt">请选择出战角色 <span>点击人物选择，再开始游戏</span></p>
          <div class="character-grid">
            <button class="character-card" type="button" data-character="minister" aria-pressed="true">
              <span class="character-art minister"><img class="character-portrait" src="./assets/character-minister.png" alt="" draggable="false"></span>
              <span class="character-details"><strong>大老师</strong><small>生命上限 8 点</small></span>
              <span class="selection-mark" aria-hidden="true"></span>
            </button>
            <button class="character-card" type="button" data-character="manager" aria-pressed="false">
              <span class="character-art manager"><img class="character-portrait" src="./assets/character-manager.png" alt="" draggable="false"></span>
              <span class="character-details"><strong>张经理</strong><small>拾取武器弹药翻倍</small></span>
              <span class="selection-mark" aria-hidden="true"></span>
            </button>
            <button class="character-card" type="button" data-character="ma" aria-pressed="false">
              <span class="character-art ma"><img class="character-portrait" src="./assets/character-ma.png" alt="" draggable="false"></span>
              <span class="character-details"><strong>马经理</strong><small>手榴弹无限</small></span>
              <span class="selection-mark" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div id="stage-select" class="stage-select" role="group" aria-label="选择起始关卡">
          <p class="stage-prompt">从第几段开始 <span>只在开始新游戏时生效</span></p>
          <div class="stage-buttons">
            <button type="button" data-stage="0" aria-pressed="true">第 1 段</button>
            <button type="button" data-stage="1" aria-pressed="false">第 2 段</button>
            <button type="button" data-stage="2" aria-pressed="false">第 3 段</button>
            <button type="button" data-stage="3" aria-pressed="false">第 4 段</button>
          </div>
        </div>
        <div id="rewards" class="rewards" hidden>
          <button type="button" data-reward="life"><span class="reward-art life-art" aria-hidden="true"><i></i><b></b></span><span>增加 1 条命</span></button>
          <button type="button" data-reward="boost"><span class="reward-art boost-art" aria-hidden="true"><i></i><b>⚡</b></span><span>火力提升 50%<br>持续 30 秒</span></button>
          <button type="button" data-reward="ammo"><span class="reward-art ammo-art" aria-hidden="true"><i></i><b></b><em></em></span><span class="ammo-reward-label">补满弹药</span></button>
        </div>
        <div class="menu-actions">
          <button class="primary" id="primary" type="button">开始游戏</button>
          <button class="secondary" id="fullscreen" type="button">全屏</button>
          <button class="secondary" id="install" type="button">安装</button>
          <button class="secondary" id="home" type="button" hidden>回到主页</button>
        </div>
        <p id="install-status" class="install-status" role="status" hidden></p>
        <p class="guide" id="guide">方向键移动 · 空格跳跃 · J 开火</p>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
